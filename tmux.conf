# Prefix: Ctrl+s, then the next key. Reload with Prefix r.
unbind C-b
set -g prefix C-s
bind b send-prefix
bind r source-file ~/.tmux.conf \; display-message 'tmux configuration reloaded'

set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB'
set -g mouse on
setw -g mode-keys vi
set -s escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g status-position top
set -g status-interval 5

# One Catppuccin-inspired palette; no competing theme plugins or weather requests.
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left '#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=#a6adc8]#H  %H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#89b4fa,bold] #I:#W #[default]'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'

bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
bind P paste-buffer
set -s set-clipboard on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Save layouts every 15 minutes; restoring remains a deliberate action.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'
# Restore shells/directories, never automatically restart coding agents or jobs.
set -g @resurrect-processes 'false'
run '~/.tmux/plugins/tpm/tpm'
